    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f12;
    }

    /* Emscripten's GLFW applies the window size to the canvas, so filling the
       viewport makes the window follow the browser window. */
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      cursor: default;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

    var Module = {
      canvas: document.getElementById('canvas'),
    };
