name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyzer-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        include:
          - os: ubuntu-22.04
            preset: vcpkg - Ninja - Release
            # Statically link libgcc/libstdc++ so the binary doesn't require
            # newer runtimes than a typical distro ships.
            configureFlags: >-
              -D CMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          - os: windows-latest
            preset: vcpkg - VS 2026
            # Static libraries with the dynamic MSVC runtime.
            configureFlags: -D VCPKG_TARGET_TRIPLET=x64-windows-static-md

    runs-on: ${{ matrix.os }}
    env:
      # The vcpkg manifest install triggered by the CMake toolchain stores its
      # binary cache here so it can be cached between runs.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GCC 15
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-15 g++-15
          echo "CC=gcc-15" >> "$GITHUB_ENV"
          echo "CXX=g++-15" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: runner.os == 'Linux'
        # Some vcpkg ports build with the autotools, and GLFW needs the X11
        # development packages and an OpenGL implementation for its windowing
        # and rendering backends.
        run: |
          sudo apt install autoconf autoconf-archive automake libtool pkg-config
          sudo apt install \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          # The triplet is part of the key so entry sets never mix.
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" ${{ matrix.configureFlags }}

      - name: Build
        run: cmake --build build --target analyzer-native analyzer-native-tests

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload analyzer-native (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-native-linux
          path: build/analyzer-native

      - name: Upload analyzer-native (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-native-windows
          path: build/Release/analyzer-native.exe

  analyzer-web:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # The CMake toolchain installs the web manifest's dependencies for
          # the wasm32-emscripten triplet.
          runVcpkgInstall: false

      - name: Configure
        run: cmake --preset emscripten

      - name: Build
        run: cmake --build --preset emscripten

      # The POST_BUILD step packages the output for static hosting: the entry
      # point is copied to index.html and the _headers file ships the
      # cross-origin isolation headers.
      - name: Upload analyzer-native (WebAssembly)
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-native-web
          path: |
            build-wasm/analyzer-native/analyzer-native.html
            build-wasm/analyzer-native/analyzer-native.js
            build-wasm/analyzer-native/analyzer-native.wasm
            build-wasm/analyzer-native/index.html
            build-wasm/analyzer-native/_headers

  analyzer-web-deploy:
    # Publishes the WebAssembly build to Cloudflare Pages at
    # https://keyboard-inspector.pages.dev. Pushes to main become production
    # deployments; manual runs deploy the branch they were started from as a
    # preview. Requires the repository secrets CLOUDFLARE_API_TOKEN (an API
    # token with the "Cloudflare Pages — Edit" permission) and
    # CLOUDFLARE_ACCOUNT_ID.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: analyzer-web
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download analyzer-native (WebAssembly)
        uses: actions/download-artifact@v7
        with:
          name: analyzer-native-web
          path: site

      - name: Create Pages project
        # Only succeeds on the first run, later runs are a no-op. If it fails
        # for another reason (e.g. a bad token), the deploy below reports it.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create keyboard-inspector --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site --project-name=keyboard-inspector
            --branch=${{ github.ref_name }} --commit-dirty=true
